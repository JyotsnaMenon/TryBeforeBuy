<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Virtual Try-On AI</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="container">

<h1>👗 Virtual Try-On AI</h1>
<p class="subtitle">Upload your photo and garment to see the magic!</p>

<div class="upload-section">

<div class="upload-box" id="personBox">
  <div class="upload-icon">👤</div>
  <h3>Person Image</h3>
  <p>Upload a clear photo</p>
  <label for="personImage" class="btn-upload">Choose Image</label>
  <input type="file" id="personImage" accept="image/*">
  <img class="preview-image" id="personPreview">
</div>

<div class="upload-box" id="garmentBox">
  <div class="upload-icon">👕</div>
  <h3>Garment Image</h3>
  <p>Upload clothing item</p>
  <label for="garmentImage" class="btn-upload">Choose Image</label>
  <input type="file" id="garmentImage" accept="image/*">
  <img class="preview-image" id="garmentPreview">
</div>

</div>

<button class="generate-btn" id="generateBtn" disabled>
🎨 Generate Try-On
</button>

<div class="status" id="status"></div>

<div class="output" id="output">

<h2>✨ Your Virtual Try-On Result</h2>

<img id="resultImage">

<button class="download-btn" id="downloadBtn">
📥 Download Image
</button>

<div id="recommendationsSection" style="display:none; margin-top: 40px; margin-bottom: 20px;">
  <h3 style="text-align: center; color: #333; margin-bottom: 20px;">Recommended For You</h3>
  <div id="recommendationsGrid" class="recommendations-grid">
    </div>
</div>

<!-- NEW rating section -->
<div id="ratingSection" style="display:none;">

<h3>Select Occasion</h3>

<select id="occasionSelect">
<option value="casual">Casual</option>
<option value="formal">Formal</option>
<option value="business">Business</option>
<option value="party">Party</option>
</select>

<br><br>

<button class="generate-btn" id="rateBtn">
⭐ Rate Try‑On
</button>

<div id="ratingResult"></div>

</div>


</div>

</div>

<script src="js/app.js"></script>

</body>
</html>
